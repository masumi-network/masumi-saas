packages:
  - "apps/*"
  - "packages/*"

# eslint-config-next 16.4 pulls eslint-plugin-react-hooks 7.1, which reports
# more set-state-in-effect/refs/memoization hits than 7.0.1 did on main.
# Pinned so the Next.js upgrade does not change lint results; lift separately.
overrides:
  eslint-plugin-react-hooks: 7.0.1

ignoredBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@sentry/cli"
  - "@swc/core"
  - "@tailwindcss/oxide"
  - "@vercel/speed-insights"
  - better-sqlite3
  - esbuild
  - puppeteer
  - puppeteer-core
  - sharp
  - unrs-resolver
  - vue-demi

onlyBuiltDependencies:
  - prisma

publicHoistPattern:
  - bun-types
  - import-in-the-middle
  - require-in-the-middle
  - "@prisma/client"
  - "@prisma/adapter-pg"
  - pg
  - pg-pool
  - eslint
  - prettier
